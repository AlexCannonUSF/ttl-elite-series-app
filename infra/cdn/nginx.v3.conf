# Phase 07 item 7 — v3 cache policy for self-hosted edges.
# Drop into a `server { ... }` block that proxies to the Spring origin.
# The origin already emits the canonical Cache-Control headers; this file
# adds gzip/br negotiation, the Vary header, and explicit
# `proxy_cache_valid` matching the spec.

# Fingerprinted assets — pin for one year, never invalidate.
location ~ ^/v3/assets/ {
    proxy_pass                 http://origin;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_cache                v3_assets;
    proxy_cache_valid          200 365d;
    proxy_cache_use_stale      updating timeout http_500 http_502 http_503 http_504;
    proxy_ignore_headers       Set-Cookie;
    add_header                 Cache-Control     "max-age=31536000, public, immutable" always;
    add_header                 Vary              "Accept-Encoding"                     always;
    gzip                       on;
    gzip_types                 application/javascript application/json text/css application/manifest+json image/svg+xml;
    brotli                     on;
    brotli_types               application/javascript application/json text/css application/manifest+json image/svg+xml;
}

# SPA shell — revalidate on every navigation, allow a 60-second stale window.
location ~ ^/v3/(.*)?$ {
    proxy_pass                 http://origin;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_cache                v3_shell;
    proxy_cache_valid          200 0s;
    proxy_cache_use_stale      updating timeout http_500 http_502 http_503 http_504;
    add_header                 Cache-Control     "no-cache, must-revalidate, public, stale-while-revalidate=60" always;
    add_header                 Vary              "Accept-Encoding"                                                  always;
    gzip                       on;
    gzip_types                 text/html;
    brotli                     on;
    brotli_types               text/html;
}

# API — never cache.
location /api/ {
    proxy_pass                 http://origin;
    proxy_set_header           Host              $host;
    proxy_set_header           X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto $scheme;
    proxy_cache                off;
    add_header                 Cache-Control     "no-store" always;
}
