services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    # Survive Docker Desktop restarts + OS reboots without operator action.
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ttl-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ttl-minio-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ttl-minio-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc --version >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9000/minio/health/live || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ttl-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ttl-minio-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 1
        done
        mc mb --ignore-existing local/ttl-raw
        mc mb --ignore-existing local/ttl-cv-audit
        mc anonymous set none local/ttl-raw
        mc anonymous set none local/ttl-cv-audit
        printf '%s' '{"Rules":[{"ID":"expire-raw-14d","Status":"Enabled","Expiration":{"Days":14},"Filter":{"Prefix":""}}]}' | mc ilm import local/ttl-raw
        printf '%s' '{"Rules":[{"ID":"expire-cv-audit-30d","Status":"Enabled","Expiration":{"Days":30},"Filter":{"Prefix":""}}]}' | mc ilm import local/ttl-cv-audit
        echo "ttl-raw + ttl-cv-audit buckets ready (lifecycle: 14d / 30d)"
    restart: "no"

volumes:
  ttl-minio-dev-data:
