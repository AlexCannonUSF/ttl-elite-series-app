spring.datasource.url=jdbc:h2:mem:ttltest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false
ttl.ingestion.raw-store.enabled=false
ttl.streamCv.vlm.engine=disabled
ttl.streamCv.vlm.gemini.apiKey=
ttl.streamCv.vlm.claude.apiKey=
ttl.cv-audit.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
ttl.shadowDiff.enabled=true
# Tests pin every feature flag to baseline via a test-only catalogue so the
# legacy settlement / staking paths still run during PaperTradingServiceTests
# regardless of what state ./features.yaml is in for dev or prod use.
ttl.features.catalogPath=classpath:features-test.yaml
ttl.score-truth.policyPath=./bet_settlement_policy.yaml
ttl.score-truth.policy.hotReloadEnabled=false
ttl.hardrock.targeted.enabled=true
ttl.hardrock.treeDiscovery.enabled=false
ttl.hardrock.treeDiscovery.scheduledEnabled=false
ttl.sofascore.enabled=false
ttl.score-truth.integration.betsapi-enabled=false
ttl.aiscore.enabled=false
ttl.itftwtt.enabled=false

scrape.auto=false
ttl.baseUrl=https://example.com
ttl.listPath=/
app.openBrowserOnStartup=false
app.autoStartWebUiDevServer=false
ttl.odds.autoMonitorEnabled=false
ttl.odds.conservativeThreshold=0.05
ttl.odds.aggressiveThreshold=0.025
ttl.prediction.minTrainingMatches=20
ttl.prediction.absoluteMinSamples=12
ttl.prediction.cvFolds=3
ttl.prediction.epochs=80
ttl.prediction.rfTrees=25
ttl.prediction.lambdaCandidates=0.0,0.001,0.01
ttl.prediction.probabilityFloor=0.1
ttl.prediction.probabilityCeiling=0.9
ttl.prediction.uncertaintyShrink=0.45
ttl.prediction.probabilityTemperature=1.2
ttl.prediction.consensusShrink=0.3
ttl.prediction.disagreementCiBoost=0.75
ttl.elo.sync.enabled=false
ttl.elo.sync.onStartup=false
ttl.paper.startingBankroll=500.0
ttl.paper.baseStakePct=0.03
ttl.paper.maxStakePct=0.08
ttl.paper.minStake=5.0
ttl.paper.maxStake=100.0
ttl.paper.autoSyncEnabled=false
ttl.paper.requireRecommendation=false
ttl.paper.allowLive=true
ttl.paper.allowPrematch=true
ttl.paper.minEdge=0.015
ttl.paper.minEdgeLive=0.018
ttl.paper.minEdgePrematch=0.015
ttl.paper.maxLongshotAmericanOdds=220
ttl.paper.minImpliedProbability=0.15
ttl.paper.maxConfidenceWidth=0.35
ttl.paper.maxNewBetsPerSync=6
ttl.paper.maxConcurrentOpenBets=18
ttl.paper.maxOpenExposurePct=0.75
ttl.paper.maxExposurePerPlayerPct=0.30
ttl.paper.maxExposurePerTriggerPct=0.40
ttl.paper.minSelectionScore=1.0
ttl.paper.maxPositiveAmericanOdds=190
ttl.paper.maxSettlementLagDays=21
ttl.paper.onlyUpcoming=true
ttl.paper.startTimeGraceMinutes=0
ttl.paper.settlementDelayMinutes=0
ttl.paper.scoreSettlementTargetSets=3
ttl.paper.scoreSettlementMinMarginSets=2
ttl.paper.minMissingObservationsForScoreSettle=1
ttl.paper.lastScoreBackfillMinutes=60
ttl.paper.minExpectedRoi=0.015
ttl.paper.databaseSettlementFallback=true
ttl.paper.databaseSettlementFallbackForTrackedAfterClose=true
ttl.paper.officialResultConfirmationEnabled=true
ttl.paper.officialResultRefreshEnabled=true
ttl.paper.officialResultRefreshPages=1
ttl.paper.officialResultMaxAgeDays=3
ttl.paper.officialResultRefreshTrackedAfterCloseOnly=true
ttl.paper.trackedAfterCloseGraceMinutes=30
ttl.paper.nearFinishFallbackEnabled=true
ttl.paper.nearFinishFallbackMissingSyncs=5
ttl.paper.nearFinishFallbackMinutes=25
ttl.paper.nearFinishFallbackMinPointLead=2
ttl.paper.nearFinishFallbackPointFloor=10
ttl.paper.staleOnBoardMinObservations=4
ttl.paper.staleOnBoardSettleMinutes=8
ttl.odds.maxRecommendedAmericanOdds=220
