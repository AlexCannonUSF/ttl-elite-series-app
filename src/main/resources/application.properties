# ===================== Database (local-default = H2 file) =====================
# IntelliJ one-click run works with no env vars.
# If the local H2 file is already locked by another TTL process, startup falls back
# to an in-memory H2 database for that run instead of failing to boot.
# Override with standard Spring env vars when needed:
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Keep hard defaults here so empty custom env vars cannot break startup.
spring.datasource.url=jdbc:h2:file:./data/ttl;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# ===================== Hibernate =====================
# Flyway now owns numbered 3.0 schema changes.
# Keep Hibernate update on for now so legacy/unmigrated tables still self-heal during the transition.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Let Hibernate auto-detect dialect from DB URL

# ===================== Logging =====================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

