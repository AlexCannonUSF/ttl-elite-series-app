ttl.paper.exploration.maxNewBetsPerSync=${TTL_PAPER_EXPLORATION_MAX_NEW_BETS_PER_SYNC:1}
# Accuracy-first research lane derived from the completed run: the losing
# segments were plus-money sides, contrarian calls, and >10 pp disagreements.
# All model calls still enter the evaluation ledger; these gates affect only
# whether the paper trader risks the fixed $1 research stake.
ttl.paper.accuracyGuard.minModelProbability=${TTL_PAPER_ACCURACY_MIN_MODEL_PROBABILITY:0.60}
ttl.paper.accuracyGuard.enabled=${TTL_PAPER_ACCURACY_GUARD_ENABLED:true}
# Keep the raw break-even gap as a price/value sanity check, but separately
# compare the model with the two-sided, vig-free Hard Rock consensus.
ttl.paper.accuracyGuard.maxModelMarketGap=${TTL_PAPER_ACCURACY_MAX_MODEL_MARKET_GAP:0.10}
ttl.paper.accuracyGuard.maxNoVigModelMarketGap=${TTL_PAPER_ACCURACY_MAX_NO_VIG_MODEL_MARKET_GAP:0.10}
# R1 degraded when the model exceeded the vig-free market by >4 pp. Keep
# those calls in all-call learning, but quarantine them from paper placement.
ttl.paper.accuracyGuard.maxPositiveNoVigModelMarketGap=${TTL_PAPER_ACCURACY_MAX_POSITIVE_NO_VIG_MODEL_MARKET_GAP:0.04}
ttl.paper.accuracyGuard.minRatingAgreement=${TTL_PAPER_ACCURACY_MIN_RATING_AGREEMENT:0.65}
ttl.paper.accuracyGuard.minSignalQuality=${TTL_PAPER_ACCURACY_MIN_SIGNAL_QUALITY:0.62}
ttl.paper.accuracyGuard.allowPositiveOdds=${TTL_PAPER_ACCURACY_ALLOW_POSITIVE_ODDS:false}
ttl.paper.policyVersion=${TTL_PAPER_POLICY_VERSION:accuracy-consensus-r2-no-vig-fixed-dollar}
# Once the first exact artifact is pinned, generic selectors and artifact
# drift are rejected from the frozen all-call ledger.
ttl.paper.modelIdentity.strictPinning=${TTL_PAPER_MODEL_IDENTITY_STRICT_PINNING:true}
