ttl.paper.officialResultRefreshPages=${TTL_PAPER_OFFICIAL_RESULT_REFRESH_PAGES:1}
ttl.paper.officialResultMaxAgeDays=${TTL_PAPER_OFFICIAL_RESULT_MAX_AGE_DAYS:3}
ttl.paper.officialResultRefreshTrackedAfterCloseOnly=${TTL_PAPER_OFFICIAL_RESULT_REFRESH_TRACKED_AFTER_CLOSE_ONLY:true}
ttl.paper.unmatchedRefundMinutes=${TTL_PAPER_UNMATCHED_REFUND_MINUTES:180}
ttl.paper.unmatchedMissingSyncs=${TTL_PAPER_UNMATCHED_MISSING_SYNCS:4}
ttl.paper.trackedAfterCloseGraceMinutes=${TTL_PAPER_TRACKED_AFTER_CLOSE_GRACE_MINUTES:30}
