# A reset still creates an auditable zero-bet baseline, then the scheduler
# starts the new research run on the next guarded tick. Override to false when
# an operator intentionally wants an armed-but-idle session.
ttl.paper.autoSyncEnabled=${TTL_PAPER_AUTO_SYNC_ENABLED:true}
ttl.paper.autoSyncCron=${TTL_PAPER_AUTO_SYNC_CRON:0 */1 * * * *}

# ===================== Ratings auto-rebuild on scrape =====================
# When TtSeriesScraper finishes a SUCCESS run with savedMatches > 0 it
# publishes a ScrapeCompletedEvent. The listener rebuilds Elo + TS-2 +
# Weng-Lin + Glicko-2 so predictions reflect the new matches without
# waiting for the cron. The default is immediate; operators may opt into a
# debounce only if they accept that bounded freshness delay.
ttl.ratings.autoRebuildOnScrape.enabled=${TTL_RATINGS_AUTO_REBUILD_ON_SCRAPE_ENABLED:true}
ttl.ratings.autoRebuildOnScrape.debounceSeconds=${TTL_RATINGS_AUTO_REBUILD_ON_SCRAPE_DEBOUNCE_SECONDS:0}

