# ===================== Database (MySQL) =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ttl_elite_series?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Alex}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== Hibernate =====================
# Keep if you want auto schema updates; or switch to 'validate' in prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Hibernate 6 warns MySQL8Dialect is deprecated; MySQLDialect also works)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================== Logging =====================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=8080

# ===================== Scraper (set these to your real site) =====================
# IMPORTANT: set this to the host that worked in your original code (no trailing slash)
ttl.baseUrl=https://YOUR-REAL-HOST
# If your working list URL looked like: https://YOUR-REAL-HOST/elite-series?page=1
ttl.listPath=/elite-series
# If your detail pages always contained some segment, put it here (or leave blank)
ttl.detail.href.mustContain=