# ===================== Database (local-default = H2 file) =====================
# IntelliJ one-click run works with no env vars.
# If the local H2 file is already locked by another TTL process, startup falls back
# to an in-memory H2 database for that run instead of failing to boot.
# Override with standard Spring env vars when needed:
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Keep hard defaults here so empty custom env vars cannot break startup.
spring.datasource.url=jdbc:h2:file:./data/ttl;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;CACHE_SIZE=131072
spring.datasource.username=sa
spring.datasource.password=

# #127 — Hikari pool tuning for H2 file mode. Writes are deliberately bounded
# to two ingestion workers below; eight total connections leave capacity for
# concurrent read-only bettor panels and schedulers during cache warmup.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# The async ingestion listeners write aliases, mirror observations, and odds
# snapshots. H2 serializes those writers, so keep their concurrency below the
# Hikari ceiling and reserve capacity for requests/schedulers.
ttl.ingestion.executor.core-pool-size=${TTL_INGESTION_EXECUTOR_CORE_POOL_SIZE:2}
ttl.ingestion.executor.max-pool-size=${TTL_INGESTION_EXECUTOR_MAX_POOL_SIZE:2}
ttl.ingestion.executor.queue-capacity=${TTL_INGESTION_EXECUTOR_QUEUE_CAPACITY:1000}

# ===================== Hibernate =====================
# Flyway now owns numbered 3.0 schema changes.
# Keep Hibernate update on for now so legacy/unmigrated tables still self-heal during the transition.
# (#127 considered moving to `validate` but deferred — needs an audit pass to confirm every
# @Entity has a paired Flyway migration before flipping; a missing migration would now block boot.)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Let Hibernate auto-detect dialect from DB URL

# ===================== Logging =====================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

