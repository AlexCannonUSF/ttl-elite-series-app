ttl.paper.minExpectedRoi=${TTL_PAPER_MIN_EXPECTED_ROI:0.024}
# Controlled paper-only exploration. These rows are visibly tagged fallback/exploration,
# capped at one minimum-stake position per sync, and never lower the user-facing recommendation gate.
ttl.paper.exploration.enabled=${TTL_PAPER_EXPLORATION_ENABLED:true}
ttl.paper.exploration.minEdge=${TTL_PAPER_EXPLORATION_MIN_EDGE:0.020}
