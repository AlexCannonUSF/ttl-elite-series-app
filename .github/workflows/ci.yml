name: CI

on:
  push:
    branches: [main, master, codex/**]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  # cancel-in-progress so a fresh push doesn't queue dead runs behind it
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-flag-lint:
    name: Feature-flag lint (expiry + required fields)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint features.yaml + enforce expiry
        run: ./scripts/lint-features.sh --enforce-expiry

  mvn-test:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    needs: feature-flag-lint
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Run full mvn test suite
        run: ./mvnw -B -ntp test

  web-v3-build:
    name: web-v3 build + perf budget
    runs-on: ubuntu-latest
    needs: feature-flag-lint
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-v3/package-lock.json

      - name: Install
        working-directory: web-v3
        run: npm ci

      - name: Build
        working-directory: web-v3
        run: npm run build

      - name: Perf audit (bundle-only, no browser in CI)
        working-directory: web-v3
        run: node scripts/perf-audit.mjs --skip-browser --fail-on-budget

  whitespace:
    name: git diff --check
    runs-on: ubuntu-latest
    needs: feature-flag-lint
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on whitespace errors
        run: git diff --check $(git merge-base HEAD origin/${{ github.base_ref || 'main' }})..HEAD 2>/dev/null || git diff --check HEAD~1..HEAD
